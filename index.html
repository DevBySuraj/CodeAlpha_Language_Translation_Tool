<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Translator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css">
  <script src="script.js" defer></script>
</head>
<body>
<div class="container">

  <header>
    <h1>Trans<em>lator</em></h1>
    <p>Microsoft Azure · Cognitive Services</p>
  </header>

  <div class="lang-bar">
    <select id="srcLang">
      <option value="">Auto-detect</option>
      <option value="en">English</option>
      <option value="hi">Hindi</option>
      <option value="pa">Punjabi</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="it">Italian</option>
      <option value="pt">Portuguese</option>
      <option value="ru">Russian</option>
      <option value="zh-Hans">Chinese (Simplified)</option>
      <option value="zh-Hant">Chinese (Traditional)</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="ar">Arabic</option>
      <option value="tr">Turkish</option>
      <option value="nl">Dutch</option>
      <option value="pl">Polish</option>
      <option value="bn">Bengali</option>
      <option value="ur">Urdu</option>
      <option value="th">Thai</option>
      <option value="vi">Vietnamese</option>
      <option value="sv">Swedish</option>
      <option value="el">Greek</option>
    </select>

    <button class="swap-btn" id="swapBtn" title="Swap languages">⇄</button>

    <select id="tgtLang">
      <option value="hi">Hindi</option>
      <option value="en" selected>English</option>
      <option value="pa">Punjabi</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="it">Italian</option>
      <option value="pt">Portuguese</option>
      <option value="ru">Russian</option>
      <option value="zh-Hans">Chinese (Simplified)</option>
      <option value="zh-Hant">Chinese (Traditional)</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="ar">Arabic</option>
      <option value="tr">Turkish</option>
      <option value="nl">Dutch</option>
      <option value="pl">Polish</option>
      <option value="bn">Bengali</option>
      <option value="ur">Urdu</option>
      <option value="th">Thai</option>
      <option value="vi">Vietnamese</option>
      <option value="sv">Swedish</option>
      <option value="el">Greek</option>
    </select>
  </div>

  <div class="panels">
    <!-- Source panel -->
    <div class="panel" id="srcPanel">
      <div class="panel-head">
        <span class="label">Source text</span>
        <span class="badge" id="detectedLabel"></span>
      </div>
      <textarea id="inputText" placeholder="Type or paste text here…" maxlength="5000"></textarea>
      <div class="panel-foot">
        <span class="char-count"><span id="charCount">0</span> / 5000</span>
        <div class="foot-actions">
            <button class="icon-btn" id="micBtn" title="Speak to Translate">🎤</button>
            <button class="icon-btn" id="copyInputBtn" title="Copy">⎘</button>
          <button class="icon-btn" id="clearBtn" title="Clear">✕</button>
        </div>
      </div>
    </div>

    <!-- Output panel -->
    <div class="panel">
      <div class="panel-head">
        <span class="label">Translation</span>
      </div>
      <div class="output-area empty" id="outputText">Translation will appear here…</div>
      <div class="panel-foot">
        <span></span>
        <div class="foot-actions">
          <button class="icon-btn" id="copyBtn" title="Copy">⎘</button>
          <button class="icon-btn" id="speakBtn" title="Read aloud">▶</button>
        </div>
      </div>
    </div>
  </div>

  <button class="translate-btn" id="translateBtn">
    <span id="btnLabel">Translate</span>
  </button>
  <div class="status" id="status"></div>

</div>
</body>
</html>
